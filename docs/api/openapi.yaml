openapi: 3.0.3
info:
  title: 工资核算系统 API
  version: 1.1.0
  description: |
    工资核算系统 M1.5 冻结契约 v1.1（后端 Controller 与前端 `src/api/types.ts` 均以此为准）。

    ## 全局约定（不可协商）

    1. **统一前缀**：所有端点以 `/api/v1` 开头。
    2. **统一响应包**：`{ "code": number, "msg": string, "data": T }`，`code = 0` 表示成功。
       错误响应使用同一响应包，`code` 非 0（见 `ErrorCode`）。

    ## 错误传输约定（R8）

    - **HTTP 状态码是权威**：`400` 参数校验失败 / `401` 未认证 / `403` 无权限 /
      `409` 冲突（重复数据、版本冲突、期间已锁定）/ `500` 系统异常。
      后端必须返回真实的 HTTP 状态码，**禁止**“HTTP 200 + body.code=4xx/5xx”的写法。
    - 错误 body 仍为统一响应包 `{code, msg, data}`，且 **`code` 与 HTTP 状态码相同**。
    - `409` 的 `data` 约定：
      - **版本冲突**（`PATCH /api/v1/periods/{id}/records`）：
        `data.conflicts` 为 `[{ "recordId": "101" }]`，列出全部冲突行，前端据此高亮；
      - **期间已锁定 / 重复数据等其它冲突**：`data` 为 `null`，`msg` 说明原因。

    ## 其余全局约定

    3. **金额一律字符串**：所有金额字段为十进制字符串（如 `"8600.00"`），
       **不允许 JSON number**。前端必须用 decimal.js 运算，禁止 `Number()` / `parseFloat`。
       明细金额恒为非负数；`gross = Σ(direction=1)`，`deduction = Σ(direction=2)`，
       `net = gross − deduction`（见 `PayDirection` / `GridRow.items`）。
    4. **ID 一律字符串**：后端把 `Long` 序列化为字符串，所有 `id` / `*Id` 字段
       在 JSON 中都是字符串（如 `"101"`）。`version` 是乐观锁版本号（DB `INT`，
       JSON 中为整数），不是 Long；**新建记录的 `version` 从 `0` 开始，每次保存 `+1`**。
    5. **分页参数**：`current` 从 1 开始，`size` 为每页条数；分页响应为
       `{ records, total, current, size }`。
    6. **枚举**：
       - 期间状态 `DRAFT | EDITING | LOCKED | ARCHIVED`
       - 员工类型 `REGULAR | PROBATION | INTERN | LABOR | OUTSOURCE | REHIRE`
       - 工资项类别 `FIXED | VARIABLE | COMPUTED`
       - 工资项方向：`1` 增加（收入）/ `2` 减少（扣款）
    7. **年月格式**：`periodYm` 匹配 `^[0-9]{4}-(0[1-9]|1[0-2])$`（如 `"2026-11"`）。
    8. **认证**：除 `POST /api/v1/auth/login` 外，所有端点都要求
       `Authorization: Bearer <token>`。
    9. **里程碑**：每个操作带 `x-milestone`。
       - `M1` 已交付（人员、薪酬档案、工资项、期间、生成、编制台、重复检测）；
       - `M1.5` 为第二阶段（汇总查询与导出、变动数据导入、系统管理）；
       - `M2` 为更远期能力，本期不实现。
    10. **文件下载例外**：导入模板、错误报告与报表导出是二进制附件
        （`Content-Disposition`），成功时不使用统一响应包；**失败时仍返回
        JSON 统一响应包**，`code` 与 HTTP 状态码一致。其余端点一律使用统一响应包。
    11. **权限点**：功能权限点清单见 `PermissionCode`。
        系统管理新增 `sys:user:view` / `sys:user:edit` / `sys:role:view` /
        `sys:role:edit` / `sys:role:grant:all` / `sys:dept:edit` / `sys:company:edit`。
        任何授权操作都不得超出操作者自身的权限点与数据范围（越权返回 403）；
        `dataScope=ALL` 只能由持有 `sys:role:grant:all` 的操作者授予。
  contact:
    name: 工资核算系统
tags:
  - name: 认证
    description: 登录与当前用户
  - name: 组织
    description: 法人主体与部门
  - name: 人员
    description: 人员主数据（敏感字段脱敏）
  - name: 薪酬档案
    description: 按生效区间版本化的薪酬档案
  - name: 工资项
    description: 工资项字典与列顺序
  - name: 期间
    description: 工资期间与状态机
  - name: 核算批次
    description: 异步生成与批次进度
  - name: 编制台
    description: 全量工资表与 changeset 批量保存
  - name: 导入
    description: M1.5 能力：变动数据导入（模板、预校验、提交、错误报告）
  - name: 报表
    description: M1.5 能力：月度/年度汇总查询与导出
  - name: 系统管理
    description: |
      M1.5 能力：用户、角色、部门、法人主体管理。
      权限点：`sys:user:view` / `sys:user:edit` / `sys:role:view` /
      `sys:role:edit` / `sys:role:grant:all` / `sys:dept:edit` / `sys:company:edit`。
security:
  - bearerAuth: []
servers:
  - url: /
    description: 同源部署（前端经 nginx 反向代理到后端）
paths:
  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 登录
      description: 用户名密码登录，返回无状态 token 与当前用户信息。
      operationId: login
      security: []
      x-milestone: M1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLogin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags: [认证]
      summary: 当前用户
      description: 返回当前用户、权限点列表与数据范围。
      operationId: me
      x-milestone: M1
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/companies:
    get:
      tags: [组织]
      summary: 主体列表
      description: 返回当前用户可见的法人主体列表（不分页）。
      operationId: listCompanies
      x-milestone: M1
      responses:
        '200':
          description: 主体列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompanyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [系统管理]
      summary: 新增法人主体
      description: 需要 `sys:company:edit`。`companyCode` 全局唯一，重复返回 409。
      operationId: createCompany
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
      responses:
        '200':
          description: 新增成功，返回主体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/depts:
    get:
      tags: [组织]
      summary: 部门树（扁平）
      description: |
        返回指定主体下的扁平部门列表，`ancestors` 为祖先路径，前端自行组装树。
        权限：已认证用户即可读（部门树是人员、期间筛选与编制台的公共基础数据，
        不额外要求系统管理权限点）。
      operationId: listDepts
      x-milestone: M1
      parameters:
        - name: companyId
          in: query
          required: true
          description: 法人主体 ID
          schema:
            $ref: '#/components/schemas/Id'
        - name: includeDisabled
          in: query
          required: false
          description: 是否包含停用部门；默认 false（仅返回启用部门）
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 部门列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDeptList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [系统管理]
      summary: 新增部门
      description: |
        需要 `sys:dept:edit`。`deptCode` 在同一主体内唯一，重复返回 409。
        `ancestors` 由后端根据 `parentId` 生成，不接受客户端提交。
      operationId: createDept
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptCreateRequest'
      responses:
        '200':
          description: 新增成功，返回部门
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDept'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees:
    get:
      tags: [人员]
      summary: 人员分页查询
      description: 按姓名/工号模糊、部门、员工类型、在职状态筛选。证件号只返回掩码。
      operationId: listEmployees
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/Current'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          required: false
          description: 姓名或工号模糊匹配
          schema:
            type: string
        - name: deptId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: employeeType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmployeeType'
        - name: status
          in: query
          required: false
          description: 1在职 2离职 3停薪留职
          schema:
            type: integer
            enum: [1, 2, 3]
      responses:
        '200':
          description: 人员分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEmployeePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [人员]
      summary: 新增人员
      description: 证件号明文只在请求中出现一次，后端加密存储并生成盲索引；响应不回显明文。
      operationId: createEmployee
      x-milestone: M1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '200':
          description: 新增成功，返回人员详情（掩码展示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEmployee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees/{id}:
    get:
      tags: [人员]
      summary: 人员详情
      description: 证件号/手机号按权限返回掩码，完整值需 `payroll:sensitive:view` 且二次确认。
      operationId: getEmployee
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 人员详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEmployee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [人员]
      summary: 修改人员
      description: 只提交需要修改的字段。`idNo` 不修改时可省略。
      operationId: updateEmployee
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回人员详情（掩码展示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEmployee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees/{id}/comp-profiles:
    get:
      tags: [薪酬档案]
      summary: 薪酬档案时间线
      description: 按 `effectiveFrom` 升序返回该员工全部薪酬档案区间。
      operationId: listCompProfiles
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 薪酬档案列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompProfileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/comp-profiles:
    post:
      tags: [薪酬档案]
      summary: 新增生效区间
      description: 校验区间不重叠；与已有区间重叠时返回 400。
      operationId: createCompProfile
      x-milestone: M1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompProfileCreateRequest'
      responses:
        '200':
          description: 新增成功，返回该段薪酬档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/comp-profiles/{id}:
    put:
      tags: [薪酬档案]
      summary: 修改薪酬档案
      description: |
        界面不暴露“版本”概念：后端自动截断旧区间并新建一段，
        返回新的当前区间（id 可能变化）。历史工资表不被改写。
      operationId: updateCompProfile
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompProfileUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回新的生效区间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/items:
    get:
      tags: [工资项]
      summary: 工资项字典
      description: 合并集团通用科目（companyId=0）与当前主体科目，按 `sortNo` 升序。
      operationId: listPayItems
      x-milestone: M1
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PayItemCategory'
        - name: status
          in: query
          required: false
          description: 1启用 0停用
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: 工资项列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPayItemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [工资项]
      summary: 新增工资项
      operationId: createPayItem
      x-milestone: M1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayItemCreateRequest'
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPayItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/items/{id}:
    put:
      tags: [工资项]
      summary: 修改工资项
      description: 已被工资表使用的科目禁止修改 `category` 与 `direction`（返回 409）。
      operationId: updatePayItem
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayItemUpdateRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPayItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/periods:
    get:
      tags: [期间]
      summary: 期间列表
      description: 返回主体下的工资期间（不分页），按 `periodYm` 倒序。
      operationId: listPeriods
      x-milestone: M1
      parameters:
        - name: companyId
          in: query
          required: false
          description: 不传则取当前用户所属主体
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 期间列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPeriodList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [期间]
      summary: 新建期间
      description: 按 `(companyId, periodYm)` 幂等：已存在时直接返回已有期间，不报错。
      operationId: createPeriod
      x-milestone: M1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCreateRequest'
      responses:
        '200':
          description: 新建或已存在的期间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPeriod'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/periods/{id}/generate:
    post:
      tags: [核算批次]
      summary: 生成基础数据（异步）
      description: 立即返回 `runId`，前端轮询 `GET /api/v1/runs/{runId}` 获取进度。
      operationId: generatePeriod
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGenerate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{runId}:
    get:
      tags: [核算批次]
      summary: 批次进度
      description: 轮询直到 `status` 为 `SUCCESS` 或 `FAILED`。`skipped` 的键为工号，值为跳过原因。
      operationId: getRun
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: 批次进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRunProgress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/periods/{id}/grid:
    get:
      tags: [编制台]
      summary: 全量工资表
      description: |
        返回该期间**全部**核算行，**不分页**（编制台需要一次性渲染与合计）。
        列由 `columns` 动态驱动，`items` 的键为 `itemCode`，值为字符串金额。
        示例见 `docs/api/examples/grid-response.json`。
      operationId: getGrid
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 工资表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGrid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/periods/{id}/records:
    patch:
      tags: [编制台]
      summary: changeset 批量保存
      description: |
        只提交改动的单元格。逐条按 `(recordId, version)` 做乐观锁更新；
        任一冲突则整体失败，返回 `code=409` 且 `data.conflicts[].recordId` 列出全部冲突项。
        成功后重算该条合计并 `version+1`，返回受影响行（含新 version 与新合计）。
        示例见 `docs/api/examples/changeset-request.json`。
      operationId: saveChangeset
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangesetRequest'
      responses:
        '200':
          description: 保存成功，返回受影响行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChangeset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 版本冲突或期间已锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChangesetConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/periods/{id}/lock:
    post:
      tags: [期间]
      summary: 锁定期间
      description: 锁定人不能是本期编制人（C4 内控）；违反返回 400。成功返回最新期间。
      operationId: lockPeriod
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 锁定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPeriod'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/periods/{id}/unlock:
    post:
      tags: [期间]
      summary: 解锁期间（高危）
      description: 必须填写原因，全程审计。成功后期间回到 `EDITING`。
      operationId: unlockPeriod
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          description: 解锁成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPeriod'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/import/template:
    get:
      tags: [导入]
      summary: 下载导入模板
      description: 需要 `payroll:import:submit`。列头由工资项字典动态生成。返回二进制 xlsx，不使用统一响应包。
      operationId: downloadImportTemplate
      x-milestone: M1.5
      parameters:
        - name: periodId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: bizType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ImportBizType'
      responses:
        '200':
          description: xlsx 模板文件
          headers:
            Content-Disposition:
              description: 附件文件名
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/import/validate:
    post:
      tags: [导入]
      summary: 上传并预校验
      description: |
        需要 `payroll:import:submit`。**不写入核算数据**
        （`pay_record` / `pay_record_item`）；但持久化 `pay_import_batch`、
        `pay_import_error` 与原始文件，保证刷新后可回捞 batchId 与错误明细、
        也可按批次重放。提交时按批次重放并**重新校验**。
        返回批次号、成功/失败行数与错误明细。
        同一 `(periodId, bizType, fileHash)` 已有批次时拒绝重复上传（409），
        由 `UNIQUE(period_id, biz_type, file_hash)` 兜底并发竞态。
      operationId: validateImport
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, periodId, bizType]
              properties:
                file:
                  type: string
                  format: binary
                  description: xlsx 文件，≤ 50MB、≤ 5 万行
                periodId:
                  $ref: '#/components/schemas/Id'
                bizType:
                  $ref: '#/components/schemas/ImportBizType'
                importMode:
                  $ref: '#/components/schemas/ImportMode'
      responses:
        '200':
          description: 预校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultImportValidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/import/{batchId}:
    get:
      tags: [导入]
      summary: 查询导入批次
      description: |
        需要 `payroll:import:submit`。刷新页面后回捞批次状态与错误明细；
        `status=VALIDATING` 时可轮询本接口获取进度。
      operationId: getImportBatch
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
      responses:
        '200':
          description: 批次详情（含错误明细，最多 5000 条）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultImportValidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/import/{batchId}/commit:
    post:
      tags: [导入]
      summary: 确认提交导入
      description: |
        需要 `payroll:import:submit`。事务内 upsert 并生成核算明细。
        已提交过的文件 hash 会被拒绝（409）。
        **`failRows > 0` 时禁止提交**：返回 409 且 `data.failRows` 为失败行数，
        必须重新校验到 0 失败后才可提交（不能只靠前端置灰）。
      operationId: commitImport
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
      responses:
        '200':
          description: 提交结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultImportCommit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 预校验存在失败行（`data.failRows` 给出数量）或文件已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultImportCommitConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/import/{batchId}/errors:
    get:
      tags: [导入]
      summary: 下载错误报告
      description: |
        需要 `payroll:export`（错误报告含工资金额，与导出同级）。
        返回二进制 xlsx（行号 + 列名 + 原因 + 原值），不使用统一响应包。
      operationId: downloadImportErrors
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/BatchIdPath'
      responses:
        '200':
          description: xlsx 错误报告
          headers:
            Content-Disposition:
              description: 附件文件名
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/monthly:
    get:
      tags: [报表]
      summary: 月度汇总
      description: |
        需要 `payroll:record:view`。按部门汇总的月度数据；仅统计 `LOCKED` 与
        `ARCHIVED` 期间，并按当前用户的数据范围（`SELF`/`DEPT`/`DEPT_SUB`/
        `COMPANY`/`ALL`）过滤。
      operationId: getMonthlyReport
      x-milestone: M1.5
      parameters:
        - name: periodYm
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: companyId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: deptId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 月度汇总行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMonthlyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/annual:
    get:
      tags: [报表]
      summary: 年度汇总
      description: |
        需要 `payroll:record:view`。按人或按部门汇总的年度数据；仅统计 `LOCKED` 与
        `ARCHIVED` 期间，并按当前用户的数据范围（`SELF`/`DEPT`/`DEPT_SUB`/
        `COMPANY`/`ALL`）过滤。
        `groupBy=DEPT` 且操作者数据范围含多个主体时 `companyId` 必填，缺则 400。
      operationId: getAnnualReport
      x-milestone: M1.5
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: groupBy
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ReportGroupBy'
        - name: companyId
          in: query
          required: false
          description: groupBy=DEPT 且操作者范围含多个主体时必填，缺则 400
          schema:
            $ref: '#/components/schemas/Id'
        - name: deptId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 年度汇总行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAnnualReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/export:
    post:
      tags: [报表]
      summary: 导出汇总报表
      description: |
        导出报表为 xlsx 文件，`reportType` 决定内容与必填参数：
        - `MONTHLY`：月度汇总，`params.periodYm` 必填；
        - `ANNUAL`：年度汇总，`params.year` + `params.groupBy` 必填；
          `groupBy=DEPT` 且操作者数据范围含多个主体时 `params.companyId` 必填
          （否则会把不同主体的同名部门合并加总），缺参返回 400；
        - `PERIOD_SHEET`：期间完整工资表（含全部工资项列），`params.periodYm` 必填，
          `params.deptId` 可选；
        - `PAYSLIP`：员工工资条（一批人或一个人），`params.periodYm` 必填，
          `params.employeeIds` 可选（不传时按数据范围导出可见人员）。
          **工资条只含姓名、工号、部门、工资项与合计，不含证件号、手机号、银行卡号**
          （最小必要原则）。
        缺少对应类型的必填参数一律返回 400。

        需要 `payroll:export` 权限；导出成功写审计日志（`pay_audit_log`，
        `action=EXPORT`，记录查询条件与导出行数）。
        数据范围过滤与查询接口一致（`SELF` / `DEPT` / `DEPT_SUB` / `COMPANY` / `ALL`）。
        金额列以**数值类型**写入，并设单元格数字格式 `#,##0.00`（保证 Excel 中可
        直接 SUM）；证件号、银行卡号、工号以**文本格式**写入（这些长数字才会被
        Excel 转成科学计数法）。

        **响应格式**：成功时 `200` 直接返回二进制 xlsx 流，**不使用统一响应包**；
        文件名由 `Content-Disposition: attachment` 给出（含报表类型、期间与时间戳）。
        失败时（`400`/`401`/`403`/`500`）**仍返回 JSON 统一响应包** `{code,msg,data}`，
        `code` 与 HTTP 状态码一致。

        **前端判据**：按 HTTP 状态码判断成功与否——`200` 即二进制流
        （`Content-Type` 为 xlsx）；失败响应的 `Content-Type` 为 `application/json`，
        按统一响应包解析错误。
      operationId: exportReport
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: xlsx 二进制流（不是统一响应包）
          headers:
            Content-Disposition:
              description: '附件文件名，如 `attachment; filename="monthly-2026-11-20261126T101500.xlsx"`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: 参数校验失败；返回 JSON 统一响应包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          description: 未认证；返回 JSON 统一响应包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '403':
          description: 缺少 `payroll:export` 权限；返回 JSON 统一响应包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '500':
          description: 导出失败；返回 JSON 统一响应包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  # -----------------------------------------------------------------
  # 系统管理（M1.5）
  # -----------------------------------------------------------------
  /api/v1/users:
    get:
      tags: [系统管理]
      summary: 用户分页查询
      description: 需要 `sys:user:view`。按用户名/姓名/主体/部门/状态筛选，密码永不返回。
      operationId: listUsers
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/Current'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          required: false
          description: 用户名或姓名模糊匹配
          schema:
            type: string
        - name: companyId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: deptId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          required: false
          description: 1启用 0停用
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: 用户分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [系统管理]
      summary: 新增用户
      description: |
        需要 `sys:user:edit`。密码只在请求中出现一次，后端 BCrypt 存储，响应不回显。
        `username` 全局唯一，重复返回 409；`employeeId` 已被其它账号关联时返回 409。
      operationId: createUser
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 新增成功，返回用户（不含密码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}:
    put:
      tags: [系统管理]
      summary: 修改用户
      description: |
        需要 `sys:user:edit`。只提交需要修改的字段；`username` 不可修改。
        不能停用自己（`status=0` 且 `id` 为当前用户）返回 409。
      operationId: updateUser
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回用户（不含密码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [系统管理]
      summary: 删除用户
      description: |
        需要 `sys:user:edit`。逻辑删除（`deleted=1`），历史审计与工资记录保留；
        不能删除自己（409）。删除账号不删除其关联的人员主数据。
      operationId: deleteUser
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 删除成功，`data` 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}/reset-password:
    post:
      tags: [系统管理]
      summary: 重置密码
      description: |
        需要 `sys:user:edit`（高危操作）。重置后旧密码立即失效；
        该用户下次请求需重新登录。无状态 HMAC token 无法逐个吊销，实现上
        token 载荷内含 `tokenVersion`，每次请求与 `sys_user.token_version` 现查比对；
        重置密码时该用户 `token_version + 1`，旧 token 即全部失效。
        新密码不会在响应中回显。
      operationId: resetUserPassword
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功，返回用户（不含密码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/permissions:
    get:
      tags: [系统管理]
      summary: 权限点目录
      description: |
        需要 `sys:role:view`。返回全部功能权限点及其名称与所属模块，
        供角色授权页勾选，避免前端硬编码权限点列表。
      operationId: listPermissions
      x-milestone: M1.5
      responses:
        '200':
          description: 权限点目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPermissionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roles:
    get:
      tags: [系统管理]
      summary: 角色列表
      description: 需要 `sys:role:view`。返回角色及其权限点（不分页）。
      operationId: listRoles
      x-milestone: M1.5
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          required: false
          description: 1启用 0停用
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [系统管理]
      summary: 新增角色
      description: |
        需要 `sys:role:edit`。`roleCode` 在同一主体内唯一，重复返回 409。
        `dataScope` 不得宽于操作者自身；授予 `ALL` 需额外持有 `sys:role:grant:all`；
        授予的权限点必须是操作者自身权限点的子集。越权返回 403。
      operationId: createRole
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '200':
          description: 新增成功，返回角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roles/{id}:
    put:
      tags: [系统管理]
      summary: 修改角色
      description: |
        需要 `sys:role:edit`。只提交需要修改的字段；权限点用 `/roles/{id}/grants` 单独维护。
        **防自我提权**：新 `dataScope` 不得宽于操作者当前数据范围；改为 `ALL` 需额外持有
        `sys:role:grant:all`。越权尝试返回 403。
      operationId: updateRole
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [系统管理]
      summary: 删除角色
      description: |
        需要 `sys:role:edit`。逻辑删除（`deleted=1`），权限点与授予关系一并失效；
        仍有用户关联该角色时返回 409，需先将用户改授其它角色。
      operationId: deleteRole
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 删除成功，`data` 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roles/{id}/grants:
    put:
      tags: [系统管理]
      summary: 设置角色权限点
      description: |
        需要 `sys:role:edit`。**全量替换**该角色的权限点集合（先删后插，事务内完成）；
        传空数组即清空。权限点取值见 `PermissionCode`。
        **防自我提权**：提交的权限点必须是操作者自身权限点的子集；包含
        `payroll:export`、`payroll:sensitive:view`、`sys:role:grant:all` 等
        操作者未持有的权限点即越权，返回 403。
      operationId: replaceRoleGrants
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGrantRequest'
      responses:
        '200':
          description: 设置成功，返回角色（含最新权限点）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/depts/{id}:
    put:
      tags: [系统管理]
      summary: 修改部门
      description: |
        需要 `sys:dept:edit`。可调整上级部门；`parentId` 不能指向自己或自己的下级（400），
        `ancestors` 由后端按新层级重算并级联更新下级。
      operationId: updateDept
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回部门
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDept'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [系统管理]
      summary: 删除部门
      description: |
        需要 `sys:dept:edit`。逻辑删除（`deleted=1`）；
        存在下级部门或关联员工/用户时返回 409，需先迁移下级与关联数据。
      operationId: deleteDept
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 删除成功，`data` 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/companies/{id}:
    put:
      tags: [系统管理]
      summary: 修改法人主体
      description: 需要 `sys:company:edit`。只提交需要修改的字段；`companyCode` 仍全局唯一。
      operationId: updateCompany
      x-milestone: M1.5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回主体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '登录返回的 token，放在 Authorization 头部的 Bearer 前缀之后。'

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID（字符串形式的 Long）
      schema:
        $ref: '#/components/schemas/Id'
    RunIdPath:
      name: runId
      in: path
      required: true
      description: 核算批次 ID（字符串形式的 Long）
      schema:
        $ref: '#/components/schemas/Id'
    BatchIdPath:
      name: batchId
      in: path
      required: true
      description: 导入批次 ID（字符串形式的 Long）
      schema:
        $ref: '#/components/schemas/Id'
    Current:
      name: current
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        default: 20

  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 400
            msg: 参数校验失败
            data: null
    Unauthorized:
      description: 未认证或登录已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 401
            msg: 未认证或登录已过期
            data: null
    Forbidden:
      description: 无权限执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 403
            msg: 无权限执行该操作
            data: null
    Conflict:
      description: 冲突（重复数据、版本冲突或期间已锁定）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 409
            msg: 期间已锁定，禁止修改
            data: null
    InternalError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 500
            msg: 服务器内部错误
            data: null

  schemas:
    # ---------------------------------------------------------------
    # 基础类型
    # ---------------------------------------------------------------
    Id:
      type: string
      description: 字符串形式的 Long ID（JS 无法安全表示超过 2^53 的整数）
      pattern: '^[0-9]+$'
      example: '101'

    Money:
      type: string
      format: decimal
      description: 金额十进制字符串，禁止使用 JSON number；展示保留两位小数，实际精度 DECIMAL(18,4)
      pattern: '^-?[0-9]{1,14}(\.[0-9]{1,4})?$'
      example: '8600.00'

    DecimalString:
      type: string
      format: decimal
      description: 非金额的十进制字符串（如工龄、计薪天数）
      pattern: '^-?[0-9]{1,10}(\.[0-9]{1,4})?$'
      example: '6.00'

    PermissionCode:
      type: string
      description: |
        功能权限点。`sys:role:grant:all` 是唯一允许授予 `dataScope=ALL` 的权限点，
        且授权者必须自身也持有该权限点。
        - 核算：`payroll:record:view`、`payroll:record:edit`
        - 期间：`payroll:period:lock`、`payroll:period:unlock`
        - 导入导出：`payroll:import:submit`、`payroll:export`
        - 敏感字段：`payroll:sensitive:view`
        - 系统管理：`sys:user:view`、`sys:user:edit`、`sys:role:view`、
          `sys:role:edit`、`sys:role:grant:all`、`sys:dept:edit`、`sys:company:edit`
      enum:
        - 'payroll:record:view'
        - 'payroll:record:edit'
        - 'payroll:period:lock'
        - 'payroll:period:unlock'
        - 'payroll:import:submit'
        - 'payroll:export'
        - 'payroll:sensitive:view'
        - 'sys:user:view'
        - 'sys:user:edit'
        - 'sys:role:view'
        - 'sys:role:edit'
        - 'sys:role:grant:all'
        - 'sys:dept:edit'
        - 'sys:company:edit'
      maxLength: 64
      example: sys:user:view

    ErrorCode:
      type: integer
      format: int32
      description: |
        业务状态码。0=成功；400=参数校验失败；401=未认证；403=无权限；
        409=冲突（重复数据 / 版本冲突 / 期间已锁定）；500=服务端错误。
        错误响应仍使用统一响应包，`code` 非 0。
      enum: [0, 400, 401, 403, 409, 500]

    Result:
      type: object
      description: 统一响应包。成功时 `code=0`；失败时 `code` 非 0，`msg` 为可展示的错误信息。
      required: [code, msg]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        msg:
          type: string
          example: ok
        data:
          description: 业务数据；错误时为 null（版本冲突的明细见 ResultChangesetConflict）

    # ---------------------------------------------------------------
    # 枚举
    # ---------------------------------------------------------------
    PeriodStatus:
      type: string
      description: 期间状态
      enum: [DRAFT, EDITING, LOCKED, ARCHIVED]

    EmployeeType:
      type: string
      description: 员工类型
      enum: [REGULAR, PROBATION, INTERN, LABOR, OUTSOURCE, REHIRE]

    PayItemCategory:
      type: string
      description: 工资项类别（FIXED 固定 / VARIABLE 变动 / COMPUTED 计算）
      enum: [FIXED, VARIABLE, COMPUTED]

    PayDirection:
      type: integer
      description: |
        工资项方向：`1` 增加（收入），`2` 减少（扣款）。
        明细金额（`items` 的值）恒为非负数，方向只由该字段表达；
        汇总口径：`gross = Σ(direction=1)`，`deduction = Σ(direction=2)`，
        `net = gross − deduction`。
      enum: [1, 2]

    PayItemDataType:
      type: string
      description: 工资项数据类型
      enum: [AMOUNT, HOURS, DAYS, RATE]

    DataScope:
      type: string
      description: 数据范围（ALL 集团 / COMPANY 本公司 / DEPT_SUB 部门及下级 / DEPT 本部门 / SELF 本人）
      enum: [ALL, COMPANY, DEPT_SUB, DEPT, SELF]

    RunStatus:
      type: string
      description: 核算批次状态
      enum: [RUNNING, SUCCESS, FAILED]

    ImportBizType:
      type: string
      description: 导入业务类型（FIXED 固定项 / VARIABLE 变动项）
      enum: [FIXED, VARIABLE]

    ImportMode:
      type: string
      description: 导入模式（UPSERT 有则覆盖 / APPEND 有则累加 / INSERT_ONLY 有则跳过）
      enum: [UPSERT, APPEND, INSERT_ONLY]

    ImportBatchStatus:
      type: string
      description: 导入批次状态
      enum: [VALIDATING, VALIDATED, COMMITTED, FAILED]

    ReportGroupBy:
      type: string
      description: 年度汇总分组方式（EMP 按人 / DEPT 按部门）
      enum: [EMP, DEPT]

    ReportType:
      type: string
      description: |
        报表类型：
        - `MONTHLY` 月度汇总（按部门）
        - `ANNUAL` 年度汇总（按人或按部门）
        - `PERIOD_SHEET` 期间完整工资表（含全部工资项列）
        - `PAYSLIP` 员工工资条（一批人或一个人）
      enum: [MONTHLY, ANNUAL, PERIOD_SHEET, PAYSLIP]

    ReportFormat:
      type: string
      description: 导出文件格式（当前仅 XLSX）
      enum: [XLSX]

    # ---------------------------------------------------------------
    # 认证
    # ---------------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    CurrentUser:
      type: object
      description: 当前登录用户
      required: [userId, username, realName, companyId, dataScope, permissions]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          maxLength: 64
        realName:
          type: string
          maxLength: 64
        companyId:
          $ref: '#/components/schemas/Id'
        employeeId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 关联人员 ID；未关联人员的账号为 null
        dataScope:
          $ref: '#/components/schemas/DataScope'
        permissions:
          type: array
          description: 权限点列表，如 payroll:record:edit
          items:
            type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 无状态 HMAC 签名 token，后续放入 Authorization 头部（Bearer 前缀）
        user:
          $ref: '#/components/schemas/CurrentUser'

    # ---------------------------------------------------------------
    # 组织
    # ---------------------------------------------------------------
    Company:
      type: object
      required: [id, companyCode, companyName, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyCode:
          type: string
          maxLength: 32
        companyName:
          type: string
          maxLength: 128
        status:
          type: integer
          description: 1启用 0停用
          enum: [0, 1]

    Dept:
      type: object
      description: 扁平部门节点；前端按 parentId/ancestors 自行组装树
      required: [id, companyId, parentId, deptCode, deptName, ancestors, sortNo, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          type: string
          pattern: '^[0-9]+$'
          description: 上级部门 ID；根部门为 "0"
          example: '0'
        deptCode:
          type: string
          maxLength: 32
        deptName:
          type: string
          maxLength: 64
        ancestors:
          type: string
          description: 祖先路径，如 ",1,2,3,"
          example: ',1,2,'
        sortNo:
          type: integer
          format: int32
        status:
          type: integer
          description: 1启用 0停用
          enum: [0, 1]

    # ---------------------------------------------------------------
    # 人员
    # ---------------------------------------------------------------
    Employee:
      type: object
      description: 人员详情。证件号/手机号只返回掩码，不返回明文。
      required:
        [id, companyId, empNo, name, gender, idType, idNoMask, employeeType,
         deptId, deptName, hireDate, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        empNo:
          type: string
          maxLength: 32
          example: E001
        name:
          type: string
          maxLength: 64
          example: 张三
        gender:
          type: integer
          description: 0未知 1男 2女
          enum: [0, 1, 2]
        idType:
          type: string
          maxLength: 16
          example: ID_CARD
        idNoMask:
          type: string
          maxLength: 32
          example: '****1234'
        mobileMask:
          type: string
          nullable: true
          maxLength: 16
          example: '138****8000'
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        jobLevel:
          type: string
          nullable: true
          maxLength: 32
          example: P6
        positionName:
          type: string
          nullable: true
          maxLength: 64
        deptId:
          $ref: '#/components/schemas/Id'
        deptName:
          type: string
          maxLength: 64
          description: 部门名称，只读（后端按 deptId 关联返回），不接受写入
        hireDate:
          type: string
          format: date
          example: '2020-03-01'
        workStartDate:
          type: string
          format: date
          nullable: true
        leaveDate:
          type: string
          format: date
          nullable: true
        status:
          type: integer
          description: 1在职 2离职 3停薪留职
          enum: [1, 2, 3]
        remark:
          type: string
          nullable: true
          maxLength: 255

    EmployeeCreateRequest:
      type: object
      required: [empNo, name, idNo, employeeType, deptId, hireDate]
      properties:
        companyId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 缺省取当前用户所属主体
        empNo:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 64
        gender:
          type: integer
          enum: [0, 1, 2]
          default: 0
        idType:
          type: string
          maxLength: 16
          default: ID_CARD
        idNo:
          type: string
          minLength: 1
          maxLength: 32
          description: 证件号明文，仅用于后端加密 + 盲索引查重，不会回显
        mobile:
          type: string
          nullable: true
          maxLength: 20
          description: 手机号明文，后端加密存储
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        jobLevel:
          type: string
          nullable: true
          maxLength: 32
        positionName:
          type: string
          nullable: true
          maxLength: 64
        deptId:
          $ref: '#/components/schemas/Id'
        hireDate:
          type: string
          format: date
        workStartDate:
          type: string
          format: date
          nullable: true
        leaveDate:
          type: string
          format: date
          nullable: true
        status:
          type: integer
          enum: [1, 2, 3]
          default: 1
        remark:
          type: string
          nullable: true
          maxLength: 255

    EmployeeUpdateRequest:
      type: object
      description: 只提交需要修改的字段；证件号不改时可省略 idNo
      properties:
        empNo:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 64
        gender:
          type: integer
          enum: [0, 1, 2]
        idType:
          type: string
          maxLength: 16
        idNo:
          type: string
          minLength: 1
          maxLength: 32
          description: 仅修改证件号时提交
        mobile:
          type: string
          nullable: true
          maxLength: 20
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        jobLevel:
          type: string
          nullable: true
          maxLength: 32
        positionName:
          type: string
          nullable: true
          maxLength: 64
        deptId:
          $ref: '#/components/schemas/Id'
        hireDate:
          type: string
          format: date
        workStartDate:
          type: string
          format: date
          nullable: true
        leaveDate:
          type: string
          format: date
          nullable: true
        status:
          type: integer
          enum: [1, 2, 3]
        remark:
          type: string
          nullable: true
          maxLength: 255

    EmployeePage:
      type: object
      required: [records, total, current, size]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        total:
          type: integer
          format: int64
        current:
          type: integer
        size:
          type: integer

    # ---------------------------------------------------------------
    # 薪酬档案
    # ---------------------------------------------------------------
    CompProfileItem:
      type: object
      required: [itemCode, amount]
      properties:
        itemCode:
          type: string
          maxLength: 32
          example: POST_ALLOW
        amount:
          $ref: '#/components/schemas/Money'

    CompProfile:
      type: object
      description: 一段生效区间；effectiveTo 为 null 表示至今
      required: [id, employeeId, effectiveFrom, baseSalary, status, items]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        employeeId:
          $ref: '#/components/schemas/Id'
        effectiveFrom:
          type: string
          format: date
          example: '2025-07-01'
        effectiveTo:
          type: string
          format: date
          nullable: true
          example: null
        baseSalary:
          $ref: '#/components/schemas/Money'
        changeReason:
          type: string
          nullable: true
          maxLength: 255
        status:
          type: integer
          description: 1有效 2作废
          enum: [1, 2]
        items:
          type: array
          description: 固定津贴明细
          items:
            $ref: '#/components/schemas/CompProfileItem'

    CompProfileCreateRequest:
      type: object
      required: [employeeId, effectiveFrom, baseSalary]
      properties:
        employeeId:
          $ref: '#/components/schemas/Id'
        effectiveFrom:
          type: string
          format: date
        baseSalary:
          $ref: '#/components/schemas/Money'
        changeReason:
          type: string
          nullable: true
          maxLength: 255
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompProfileItem'

    CompProfileUpdateRequest:
      type: object
      description: 修改生效日或金额；后端自动截断旧区间并新建一段
      properties:
        effectiveFrom:
          type: string
          format: date
        baseSalary:
          $ref: '#/components/schemas/Money'
        changeReason:
          type: string
          nullable: true
          maxLength: 255
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompProfileItem'

    # ---------------------------------------------------------------
    # 工资项
    # ---------------------------------------------------------------
    PayItem:
      type: object
      required:
        [id, companyId, itemCode, itemName, category, direction, dataType,
         precisionScale, includeInGross, editable, importable, sortNo, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
          description: 0 表示集团通用科目
        itemCode:
          type: string
          maxLength: 32
          example: PERF_BONUS
        itemName:
          type: string
          maxLength: 64
          example: 绩效奖金
        category:
          $ref: '#/components/schemas/PayItemCategory'
        direction:
          $ref: '#/components/schemas/PayDirection'
        dataType:
          $ref: '#/components/schemas/PayItemDataType'
        precisionScale:
          type: integer
          format: int32
          example: 2
        includeInGross:
          type: boolean
          description: 是否计入应发合计
        editable:
          type: boolean
          description: 是否允许手工编辑
        importable:
          type: boolean
          description: 是否允许导入
        sortNo:
          type: integer
          format: int32
          description: 工资表列顺序
        status:
          type: integer
          description: 1启用 0停用
          enum: [0, 1]

    PayItemCreateRequest:
      type: object
      required: [itemCode, itemName, category, direction]
      properties:
        companyId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 缺省取当前用户所属主体；0 表示集团通用
        itemCode:
          type: string
          minLength: 1
          maxLength: 32
        itemName:
          type: string
          minLength: 1
          maxLength: 64
        category:
          $ref: '#/components/schemas/PayItemCategory'
        direction:
          $ref: '#/components/schemas/PayDirection'
        dataType:
          $ref: '#/components/schemas/PayItemDataType'
        precisionScale:
          type: integer
          format: int32
          default: 2
        includeInGross:
          type: boolean
          default: true
        editable:
          type: boolean
          default: true
        importable:
          type: boolean
          default: true
        sortNo:
          type: integer
          format: int32
          default: 0
        status:
          type: integer
          enum: [0, 1]
          default: 1

    PayItemUpdateRequest:
      type: object
      description: 已被使用的科目禁止修改 category 与 direction（409）
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 64
        category:
          $ref: '#/components/schemas/PayItemCategory'
        direction:
          $ref: '#/components/schemas/PayDirection'
        dataType:
          $ref: '#/components/schemas/PayItemDataType'
        precisionScale:
          type: integer
          format: int32
        includeInGross:
          type: boolean
        editable:
          type: boolean
        importable:
          type: boolean
        sortNo:
          type: integer
          format: int32
        status:
          type: integer
          enum: [0, 1]

    # ---------------------------------------------------------------
    # 期间与批次
    # ---------------------------------------------------------------
    Period:
      type: object
      required:
        [id, companyId, periodYm, status, employeeCount, totalGross, totalNet, hpd]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        periodYm:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-11'
        status:
          $ref: '#/components/schemas/PeriodStatus'
        employeeCount:
          type: integer
        totalGross:
          $ref: '#/components/schemas/Money'
        totalNet:
          $ref: '#/components/schemas/Money'
        hpd:
          $ref: '#/components/schemas/DecimalString'
          description: 期间计薪天数参数，默认 21.75
        compiledBy:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 最后编制人用户 ID（锁定内控：锁定人不能等于编制人）
        lockedBy:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 锁定人用户 ID；未锁定为 null
        lockedAt:
          type: string
          format: date-time
          nullable: true
          description: 锁定时间；未锁定为 null
        unlockReason:
          type: string
          nullable: true
          maxLength: 255
          description: 最近一次解锁原因；未解锁过为 null

    PeriodCreateRequest:
      type: object
      required: [periodYm]
      properties:
        companyId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 缺省取当前用户所属主体
        periodYm:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-11'

    GenerateResult:
      type: object
      required: [runId]
      properties:
        runId:
          $ref: '#/components/schemas/Id'

    RunError:
      type: object
      required: [empNo, message]
      properties:
        empNo:
          type: string
          maxLength: 32
          example: E001
        message:
          type: string
          example: 该员工本月已在『上海分公司』的工资表中

    RunProgress:
      type: object
      required: [status, total, success, failed, errors]
      properties:
        status:
          $ref: '#/components/schemas/RunStatus'
        total:
          type: integer
          description: 应生成人数
        success:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RunError'
        skipped:
          type: object
          description: 被跳过的人员，键为工号，值为原因（如“未配置薪酬档案”）
          additionalProperties:
            type: string
          example:
            E999: 未配置薪酬档案

    # ---------------------------------------------------------------
    # 编制台
    # ---------------------------------------------------------------
    GridPeriod:
      type: object
      required: [id, periodYm, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        periodYm:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        status:
          $ref: '#/components/schemas/PeriodStatus'

    GridColumn:
      type: object
      description: 工资表动态列，由工资项字典驱动
      required: [itemCode, itemName, category, direction, scale, editable]
      properties:
        itemCode:
          type: string
          maxLength: 32
          example: PERF_BONUS
        itemName:
          type: string
          maxLength: 64
          example: 绩效奖金
        category:
          $ref: '#/components/schemas/PayItemCategory'
        direction:
          $ref: '#/components/schemas/PayDirection'
        scale:
          type: integer
          format: int32
          description: 显示小数位数
        editable:
          type: boolean

    GridRow:
      type: object
      description: 一条核算记录的完整行；items 只包含该员工本期有明细的工资项
      required:
        [recordId, version, employeeId, empNo, empName, deptId, deptName,
         employeeType, jobLevel, seniorityYears, grossAmount, deductionAmount,
         netAmount, items]
      properties:
        recordId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int32
          description: 乐观锁版本号，新建记录从 `0` 开始、每次保存 `+1`；保存 changeset 时必须原样带回
          example: 0
        employeeId:
          $ref: '#/components/schemas/Id'
        empNo:
          type: string
          maxLength: 32
        empName:
          type: string
          maxLength: 64
        deptId:
          $ref: '#/components/schemas/Id'
        deptName:
          type: string
          maxLength: 64
        employeeType:
          $ref: '#/components/schemas/EmployeeType'
        jobLevel:
          type: string
          nullable: true
          maxLength: 32
        seniorityYears:
          $ref: '#/components/schemas/DecimalString'
        grossAmount:
          $ref: '#/components/schemas/Money'
        deductionAmount:
          $ref: '#/components/schemas/Money'
        netAmount:
          $ref: '#/components/schemas/Money'
        items:
          type: object
          description: |
            键为 `itemCode`，值为字符串金额，且恒为非负数（方向由列定义的 `direction` 表达）。
            该行有明细的工资项才会出现；键必然在 `columns[].itemCode` 之内。
            汇总口径：`grossAmount = Σ(direction=1 的 items)`，
            `deductionAmount = Σ(direction=2 的 items)`，`netAmount = grossAmount − deductionAmount`。
          additionalProperties:
            $ref: '#/components/schemas/Money'
          example:
            BASE_SALARY: '8000.00'
            SENIORITY_PAY: '600.00'

    GridResponse:
      type: object
      description: |
        `columns` 覆盖该主体**全部启用科目**（按 `sortNo` 排序），是本期间工资表的完整列集合；
        `items` 的键必然在 `columns[].itemCode` 之内。
        `docs/api/examples/grid-response.json` 是为篇幅截断的示例（只展示 2 列），
        不代表真实响应只会返回 2 列——前端必须完全按 `columns` 动态渲染。
      required: [period, columns, rows, total]
      properties:
        period:
          $ref: '#/components/schemas/GridPeriod'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/GridColumn'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GridRow'
        total:
          type: integer
          description: 行数（非分页，等于 rows.length）

    ChangesetItem:
      type: object
      required: [itemCode, amount]
      properties:
        itemCode:
          type: string
          maxLength: 32
          example: PERF_BONUS
        amount:
          $ref: '#/components/schemas/Money'

    ChangesetChange:
      type: object
      required: [recordId, version, items]
      properties:
        recordId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int32
          description: 该行当前版本号（来自 grid 响应；新建记录从 `0` 开始、每次保存 `+1`）
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChangesetItem'

    ChangesetRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChangesetChange'

    ChangesetResult:
      type: object
      description: 保存成功后返回受影响行（含新的 version 与重算后的合计）
      required: [updated, rows]
      properties:
        updated:
          type: integer
          description: 受影响行数
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GridRow'

    ConflictItem:
      type: object
      required: [recordId]
      properties:
        recordId:
          $ref: '#/components/schemas/Id'

    ChangesetConflicts:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'

    UnlockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: 解锁原因，必填，写入审计

    # ---------------------------------------------------------------
    # 导入    # ---------------------------------------------------------------
    ImportError:
      type: object
      required: [rowNo, errorCode, errorMsg]
      properties:
        rowNo:
          type: integer
          description: Excel 行号
        columnName:
          type: string
          nullable: true
        rawValue:
          type: string
          nullable: true
        errorCode:
          type: string
          maxLength: 32
        errorMsg:
          type: string
          maxLength: 255

    ImportValidateResult:
      type: object
      required: [batchId, totalRows, successRows, failRows, status, errors]
      properties:
        batchId:
          $ref: '#/components/schemas/Id'
        totalRows:
          type: integer
        successRows:
          type: integer
        failRows:
          type: integer
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        errors:
          type: array
          description: 仅保留前 5000 条错误
          items:
            $ref: '#/components/schemas/ImportError'

    ImportCommitResult:
      type: object
      required: [batchId, status, successRows, failRows]
      properties:
        batchId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        successRows:
          type: integer
        failRows:
          type: integer

    # ---------------------------------------------------------------
    # 报表    # ---------------------------------------------------------------
    MonthlyReportRow:
      type: object
      description: |
        仅统计 `LOCKED` 与 `ARCHIVED` 期间；按部门汇总。
        `employeeCount` 为**去重后的在职人数**（同一人跨月只计一次），
        因此年度值不等于各月相加，前端不得用「年度值 ÷ 12」做校验。
      required:
        [companyId, periodYm, deptId, employeeCount, grossAmount,
         deductionAmount, netAmount]
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        periodYm:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        deptId:
          $ref: '#/components/schemas/Id'
        deptName:
          type: string
          nullable: true
        employeeCount:
          type: integer
        grossAmount:
          $ref: '#/components/schemas/Money'
        deductionAmount:
          $ref: '#/components/schemas/Money'
        netAmount:
          $ref: '#/components/schemas/Money'

    AnnualReportRow:
      type: object
      description: |
        仅统计 `LOCKED` 与 `ARCHIVED` 期间；年度按**归属期间**归集，
        13 薪与年终奖计入其归属月份所在年度。
        `employeeCount` 为**去重后的在职人数**（同一人跨月只计一次），
        因此年度值不等于各月相加，前端不得用「年度值 ÷ 12」做校验。
      required:
        [year, groupBy, employeeCount, grossAmount, deductionAmount, netAmount]
      properties:
        year:
          type: string
          pattern: '^[0-9]{4}$'
          example: '2026'
        groupBy:
          $ref: '#/components/schemas/ReportGroupBy'
        deptId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        deptName:
          type: string
          nullable: true
        employeeId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: groupBy=EMP 时有值
        empNo:
          type: string
          nullable: true
        empName:
          type: string
          nullable: true
        employeeCount:
          type: integer
        grossAmount:
          $ref: '#/components/schemas/Money'
        deductionAmount:
          $ref: '#/components/schemas/Money'
        netAmount:
          $ref: '#/components/schemas/Money'

    # ---------------------------------------------------------------
    # 报表导出（M1.5）
    # ---------------------------------------------------------------
    ReportExportParams:
      type: object
      description: |
        查询条件，按 `reportType` 取用不同字段：
        - `MONTHLY`：`periodYm` 必填；
        - `ANNUAL`：`year` + `groupBy` 必填；`groupBy=DEPT` 且操作者数据范围含多个
          主体时 `companyId` 必填（否则会把不同主体的同名部门加总）；
        - `PERIOD_SHEET`：`periodYm` 必填，`deptId` 可选（限定部门）；
        - `PAYSLIP`：`periodYm` 必填，`employeeIds` 可选（一批人或一个人；
          不传时按当前用户数据范围导出可见人员）。
        缺少对应类型的必填参数返回 400。
        全部报表仅统计 `LOCKED` 与 `ARCHIVED` 期间，并按当前用户的数据范围过滤。
      properties:
        periodYm:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: MONTHLY / PERIOD_SHEET / PAYSLIP 必填，如 "2026-11"
        year:
          type: string
          pattern: '^[0-9]{4}$'
          description: ANNUAL 必填，如 "2026"
        groupBy:
          $ref: '#/components/schemas/ReportGroupBy'
        companyId:
          description: ANNUAL + groupBy=DEPT 且操作者范围含多主体时必填，缺则 400
          allOf:
            - $ref: '#/components/schemas/Id'
        deptId:
          $ref: '#/components/schemas/Id'
        employeeIds:
          type: array
          description: PAYSLIP 可选；指定则只导出这些人，不传按数据范围导出可见人员
          items:
            $ref: '#/components/schemas/Id'

    ExportRequest:
      type: object
      required: [reportType, params, format]
      properties:
        reportType:
          $ref: '#/components/schemas/ReportType'
        params:
          $ref: '#/components/schemas/ReportExportParams'
        format:
          $ref: '#/components/schemas/ReportFormat'

    # ---------------------------------------------------------------
    # 系统管理（M1.5）
    # ---------------------------------------------------------------
    PermissionItem:
      type: object
      required: [code, name, module]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        name:
          type: string
          maxLength: 64
          example: 查看核算
        module:
          type: string
          description: 所属模块
          enum: [PAYROLL, SYS]

    User:
      type: object
      description: 系统用户。密码哈希永不返回；手机号只返回掩码。
      required:
        [id, companyId, username, realName, status, roleIds, permissions, dataScope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          maxLength: 64
        realName:
          type: string
          maxLength: 64
        employeeId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: 关联人员 ID；未关联人员时为 null
        deptId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        mobileMask:
          type: string
          nullable: true
          maxLength: 16
          example: 138****8000
        status:
          type: integer
          description: 1启用 0停用
          enum: [0, 1]
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        permissions:
          type: array
          description: 该用户经全部角色合并后的权限点（只读）
          items:
            $ref: '#/components/schemas/PermissionCode'
        dataScope:
          $ref: '#/components/schemas/DataScope'

    UserPage:
      type: object
      required: [records, total, current, size]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        current:
          type: integer
        size:
          type: integer

    UserCreateRequest:
      type: object
      required: [companyId, username, password, realName]
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 明文只在请求中出现一次，后端 BCrypt 存储
        realName:
          type: string
          minLength: 1
          maxLength: 64
        employeeId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        deptId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        status:
          type: integer
          enum: [0, 1]
          default: 1
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          default: []

    UserUpdateRequest:
      type: object
      description: 只提交需要修改的字段；`username` 与 `companyId` 不可修改。
      properties:
        realName:
          type: string
          minLength: 1
          maxLength: 64
        employeeId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        deptId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
        status:
          type: integer
          enum: [0, 1]
        roleIds:
          type: array
          description: 全量替换用户角色
          items:
            $ref: '#/components/schemas/Id'

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 重置后旧密码立即失效；该用户下次请求需重新登录（token 内含版本号，每请求比对 `sys_user.token_version`，重置时 +1）

    Role:
      type: object
      required: [id, companyId, roleCode, roleName, dataScope, status, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        roleCode:
          type: string
          maxLength: 64
        roleName:
          type: string
          maxLength: 64
        dataScope:
          $ref: '#/components/schemas/DataScope'
        remark:
          type: string
          nullable: true
          maxLength: 255
        status:
          type: integer
          description: 1启用 0停用
          enum: [0, 1]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'

    RoleCreateRequest:
      type: object
      required: [companyId, roleCode, roleName, dataScope]
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        roleCode:
          type: string
          minLength: 1
          maxLength: 64
        roleName:
          type: string
          minLength: 1
          maxLength: 64
        dataScope:
          $ref: '#/components/schemas/DataScope'
        remark:
          type: string
          nullable: true
          maxLength: 255
        status:
          type: integer
          enum: [0, 1]
          default: 1
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
          default: []

    RoleUpdateRequest:
      type: object
      description: 只提交需要修改的字段；权限点请使用 `PUT /roles/{id}/grants`。
      properties:
        roleCode:
          type: string
          minLength: 1
          maxLength: 64
        roleName:
          type: string
          minLength: 1
          maxLength: 64
        dataScope:
          $ref: '#/components/schemas/DataScope'
        remark:
          type: string
          nullable: true
          maxLength: 255
        status:
          type: integer
          enum: [0, 1]

    RoleGrantRequest:
      type: object
      description: 全量替换角色的权限点集合；传空数组即清空。
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'

    CompanyCreateRequest:
      type: object
      required: [companyCode, companyName]
      properties:
        companyCode:
          type: string
          minLength: 1
          maxLength: 32
        companyName:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: integer
          enum: [0, 1]
          default: 1

    CompanyUpdateRequest:
      type: object
      description: 只提交需要修改的字段。
      properties:
        companyCode:
          type: string
          minLength: 1
          maxLength: 32
        companyName:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: integer
          enum: [0, 1]

    DeptCreateRequest:
      type: object
      required: [companyId, deptCode, deptName]
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          type: string
          pattern: '^[0-9]+$'
          default: '0'
          description: 上级部门 ID；根部门为 "0"
        deptCode:
          type: string
          minLength: 1
          maxLength: 32
        deptName:
          type: string
          minLength: 1
          maxLength: 64
        sortNo:
          type: integer
          format: int32
          default: 0
        status:
          type: integer
          enum: [0, 1]
          default: 1

    DeptUpdateRequest:
      type: object
      description: 只提交需要修改的字段；`companyId` 不可修改，`ancestors` 由后端重算。
      properties:
        parentId:
          type: string
          pattern: '^[0-9]+$'
        deptCode:
          type: string
          minLength: 1
          maxLength: 32
        deptName:
          type: string
          minLength: 1
          maxLength: 64
        sortNo:
          type: integer
          format: int32
        status:
          type: integer
          enum: [0, 1]

