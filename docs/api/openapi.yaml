    ResultImportCommitConflict:
      type: object
      description: |
        提交冲突（code 固定 409）。预校验 `failRows > 0` 时 `data.failRows` 给出失败行数；
        文件已提交或其它冲突时 `data` 为 null。
      required: [code, msg, data]
      properties:
        code:
          type: integer
          enum: [409]
          example: 409
        msg:
          type: string
          example: 预校验存在 3 行失败，禁止提交
        data:
          type: object
          nullable: true
          description: 失败行数；其它冲突时为 null
          required: [batchId, failRows]
          properties:
            batchId:
              $ref: '#/components/schemas/Id'
            failRows:
              type: integer
              minimum: 1

