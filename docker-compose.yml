services:
  mysql:
    image: mysql:8.0
    container_name: payroll-mysql
    restart: unless-stopped
    environment:
      # 凭证从 .env 读取，缺失时 compose 直接报错退出，不提供默认值
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payroll}
      MYSQL_USER: ${MYSQL_USER:-payroll}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --lower-case-table-names=1
    ports:
      # 只绑本机回环，不对局域网暴露数据库端口
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - payroll-mysql-data:/var/lib/mysql
      # 仅在数据卷为空时自动执行一次
      - ./db/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppayroll_root_2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 可选组件：默认不启动。镜像当前在 Docker Hub / quay.io 均需授权拉取。
  # 拿到镜像后：docker compose --profile minio up -d
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    container_name: payroll-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: payroll
      MINIO_ROOT_PASSWORD: payroll_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - payroll-minio-data:/data

volumes:
  payroll-mysql-data:
  payroll-minio-data:
