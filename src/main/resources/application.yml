server:
  port: 8080

spring:
  application:
    name: payroll
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/payroll?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    # 凭证必须由环境变量注入（IDE 运行配置 / 容器 env / systemd EnvironmentFile），不设默认值，缺失即启动失败
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      # 契约允许 5 万行，5 万行 xlsx 通常 15–30MB；原来 10MB 与契约自相矛盾。
      # 行数上限仍由 payroll.import.max-rows 控制，这里只是别让文件先被容器拒掉。
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

payroll:
  calendar:
    # 法定节假日（逗号分隔 ISO 日期）。M1 允许为空，只按周末计算工作日；
    # 需要精确口径时由运维注入，例：PAYROLL_HOLIDAYS=2026-10-01,2026-10-02
    holidays: ${PAYROLL_HOLIDAYS:}
  storage:
    type: local
    local-path: ./data/import
  security:
    # 生产环境必须通过环境变量注入，无默认值兜底
    id-no-salt: ${PAYROLL_ID_SALT}
    aes-key: ${PAYROLL_AES_KEY}
    # 无状态 token 的 HMAC 密钥；轮换后所有已签发 token 立即失效
    token-secret: ${PAYROLL_TOKEN_SECRET}
    token-ttl-minutes: 720
  import:
    max-rows: 50000
    max-error-rows: 5000
