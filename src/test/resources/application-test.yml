spring:
  # 测试库与开发库分离，避免跑测试时污染 payroll 库。
  # 凭证仍从环境变量读取；本地未 export 时回退读取仓库根目录 .env（同应用启动方式）。
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/payroll_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

payroll:
  security:
    # 测试专用固定密钥，与生产/开发环境无关
    token-secret: test-only-token-secret-000000000000
    token-ttl-minutes: 120
    id-no-salt: 0123456789abcdef0123456789abcdef
    aes-key: 0123456789abcdef0123456789abcdef
  storage:
    # 导入文件落到系统临时目录，不污染仓库
    local-path: ${java.io.tmpdir}/payroll-test-import

logging:
  level:
    com.insbean.payroll: INFO
